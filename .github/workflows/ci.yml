# Modèle CI Node/TypeScript — à copier dans <projet>/.github/workflows/ci.yml
# Filet minimal sur chaque PR : install + lint + typecheck + tests. Adapter les scripts au projet.
name: CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"        # <23 (bug next build sous Node 24 — cf. PIEGES_CONNUS)
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
